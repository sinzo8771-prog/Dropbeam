name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run size
      # Installs the Chromium binary for the e2e specs in tests/e2e;
      # --with-deps also pulls the system libraries Chromium needs on
      # the GitHub-hosted runner.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
